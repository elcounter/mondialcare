<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exemple</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5EBABC">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Exemple">
<style>
  :root { --txt:#3c3c3b; --muted:#6b7280; --line:#3c3c3b; --accent:#5EBABC; --warn:#white; --bg:#ffffff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font-family:"Helvetica Neue", Helvetica, Arial, sans-serif; }
  .banner { background:var(--warn); color:#fff; text-align:center; font-weight:bold; padding:10px 16px; letter-spacing:.5px; }
  header { text-align:center; padding:20px 16px 0; color:var(--accent); font-weight:bold; font-size:20px; }
  main { max-width:1100px; margin:0 auto; padding:16px; position:relative; }
  main::before { content:""; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:clamp(40px,10vw,120px); font-weight:bold; color:rgba(185,28,28,.08); transform:rotate(-15deg); pointer-events:none; }
  h1 { text-align:center; font-weight:300; text-decoration:underline; color:var(--muted); font-size:26px; }
  h2 { text-align:normal; font-weight:300; color:black; font-size:46px; font-weight: bold; }
  .wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:14px; min-width:640px; }
  th, td { border:1px solid var(--line); padding:6px 8px; text-align:center; }
  th { color:var(--muted); }
  td { color:var(--muted); font-weight:300; }
  .status { display:flex; gap:14px; align-items:center; justify-content:center; margin:18px auto; max-width:800px; color:var(--muted); font-size:18px; font-weight:300; }
  .dot { flex:none; width:32px; height:32px; border-radius:50%; background:var(--accent); }
  footer { text-align:center; font-size:12px; color:var(--muted); padding:16px; }
</style>
</head>
<body>
  <div class="banner"></div>
  <h1><img src="" alt="img"></h1>
  <header>Exemple</header>
  <main>
    <h2>Exemple</h2>
    <h3>Exemple</h3>
<img src="" alt="img">
    <h1>L'ASSURÉE</h1>
    <div class="wrap">
      <table>
        <thead>
          <tr><th>NOM</th><th>PRÉNOM</th><th>DATE DE SOUSCRIPTION</th><th>DATE DE NAISSANCE</th><th>NATIONALITÉ</th><th>PASSEPORT</th></tr>
        </thead>
        <tbody>
          <tr><td>Exemple</td><td>Exemple</td><td>Exemple</td><td>Exemple</td><td>Exemple</td><td>Exemple</td></tr>
        </tbody>
      </table>
    </div>
  </main>
  <footer>© 2022 Exemple</footer>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch((err) => console.warn('Service worker non enregistré :', err));
    });
  }
</script>
</body>
</html>
